# Netlify config for the Flutter web build. The site is built and deployed by
# GitHub Actions (.github/workflows/deploy.yml), not by Netlify.

[build]
  publish = "app/build/web"
  # Backstop in case Netlify's own builds are re-enabled: exit 0 cancels them.
  ignore = "exit 0"

# SPA fallback. Status 200 without `force` only applies when no file matches.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # The web3d scene is embedded in a same-origin <iframe>.
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Flutter's entry files have stable names, so they must always be revalidated
# or users get a stale app after a deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# CanvasKit / skwasm files are tied to the Flutter engine version but not
# content-hashed: cache for a day, then revalidate.
[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The bundled web3d scene is one self-contained, non-hashed HTML file.
# Other Flutter assets keep Netlify's default (max-age=0, must-revalidate).
[[headers]]
  for = "/assets/assets/web3d/*"
  [headers.values]
    Cache-Control = "no-cache"
