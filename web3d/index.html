<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Kebunku 3D</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #dfeae0;
        /* The scene is driven by Flutter; never let the WebView scroll or long-press. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #fps {
        position: fixed;
        top: 8px;
        left: 8px;
        font: 12px/1.4 ui-monospace, monospace;
        color: #2f4f32;
        background: rgba(255, 255, 255, 0.72);
        padding: 2px 6px;
        border-radius: 4px;
        pointer-events: none;
      }
      #fps[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="fps" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
