name: Deploy web

# Builds web3d/ + the Flutter web app and deploys app/build/web to Netlify.
# Runs only on pushes to main (i.e. after a PR is merged) -> production deploy.
# The deploy steps are skipped (build still runs) when the Netlify secrets are
# not configured.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.1'
  NODE_VERSION: '22'
  NETLIFY_CLI_VERSION: '23'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web3d/package-lock.json

      - name: Build web3d
        working-directory: web3d
        run: |
          npm ci
          npm run build
          # vite writes straight into the Flutter assets (see vite.config.ts).
          test -f ../app/assets/web3d/index.html

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Flutter web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release
          test -f build/web/assets/assets/web3d/index.html

      - name: Check Netlify secrets
        id: secrets
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Netlify deploy skipped::NETLIFY_AUTH_TOKEN and/or NETLIFY_SITE_ID are not set for this run."
          fi

      - name: Deploy to Netlify
        if: steps.secrets.outputs.available == 'true'
        env:
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
        run: |
          # Run from the repo root so netlify.toml (headers, redirects) is applied.
          # --no-build: GitHub Actions already built the site.
          message="${COMMIT_TITLE%%$'\n'*} (${GITHUB_SHA::7})"
          npx --yes "netlify-cli@$NETLIFY_CLI_VERSION" deploy --no-build --prod \
            --dir=app/build/web --site="$NETLIFY_SITE_ID" --message="$message" --json > netlify-deploy.json
          url=$(jq -r '.url' netlify-deploy.json)
          echo "### Netlify deploy: $url" >> "$GITHUB_STEP_SUMMARY"
