name: Deploy web

# Builds web3d/ + the Flutter web app and publishes app/build/web to GitHub
# Pages (https://dimas-ibnu.github.io/3d_urban_farming_mapping/).
# Runs only on pushes to main (i.e. after a PR is merged).

on:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FLUTTER_VERSION: '3.44.1'
  NODE_VERSION: '22'
  # Project pages are served from /<repo>/, so Flutter needs a matching base href.
  BASE_HREF: /${{ github.event.repository.name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web3d/package-lock.json

      - name: Build web3d
        working-directory: web3d
        run: |
          npm ci
          npm run build
          # vite writes straight into the Flutter assets (see vite.config.ts).
          test -f ../app/assets/web3d/index.html

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Flutter web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --base-href "$BASE_HREF"
          test -f build/web/assets/assets/web3d/index.html
          # Serve files as-is (no Jekyll processing).
          touch build/web/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
