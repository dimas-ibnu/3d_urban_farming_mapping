name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.1'
  NODE_VERSION: '22'

jobs:
  web3d:
    name: web3d lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web3d/package-lock.json
      - run: npm ci
        working-directory: web3d
      - run: npm run lint
        working-directory: web3d
      - run: npm run typecheck
        working-directory: web3d
      - run: npm run build
        working-directory: web3d
      # Every Flutter job needs the scene bundled into app/assets/web3d, so it
      # is built once here and reused instead of rebuilt three times.
      - uses: actions/upload-artifact@v4
        with:
          name: web3d-bundle
          path: app/assets/web3d/index.html
          if-no-files-found: error

  flutter-analyze-test:
    name: flutter analyze and test
    runs-on: ubuntu-latest
    needs: web3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web3d-bundle
          path: app/assets/web3d
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  build-web:
    name: flutter build web
    runs-on: ubuntu-latest
    needs: web3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web3d-bundle
          path: app/assets/web3d
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build web --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/build/web

  build-android:
    name: flutter build apk (debug)
    runs-on: ubuntu-latest
    needs: web3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web3d-bundle
          path: app/assets/web3d
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --debug
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
